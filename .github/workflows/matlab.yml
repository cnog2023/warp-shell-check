name: matlab

# MathWorks licenses MATLAB at no cost on GitHub-hosted runners for public repositories when the
# matlab-actions run-* actions are used (see sources/web/github_matlab_actions_setup_matlab_licensing.md).
# This job clones WarpFactory (MIT) and runs the scripts under matlab/.

on:
  push:
    branches: [main]
    paths:
      - "matlab/**"
      - ".github/workflows/matlab.yml"
  workflow_dispatch:

concurrency:
  group: matlab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: WarpFactory smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Clone WarpFactory (MIT, NerdsWithAttitudes/WarpFactory @ main)
        run: |
          git clone --depth 1 https://github.com/NerdsWithAttitudes/WarpFactory.git external/WarpFactory
          git -C external/WarpFactory log -1 --format='WarpFactory %h %cs'

      # WarpFactory calls isgpuarray() unconditionally (Solver/utils/takeFiniteDifference1.m line 4),
      # a Parallel Computing Toolbox function, so the toolbox is needed even on the CPU path.
      # Found on the first CI run, 18 Oct 2026; the free public-repo licence covers it.
      - name: Set up MATLAB with Parallel Computing Toolbox
        uses: matlab-actions/setup-matlab@v2
        with:
          products: Parallel_Computing_Toolbox
          cache: true

      - name: Run smoke test
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(genpath('external/WarpFactory')); addpath('matlab'); smoke_test

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: results/smoke/
          if-no-files-found: warn

  shell:
    name: Build the Fuchs shell (W1 example configuration)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Clone WarpFactory (MIT, NerdsWithAttitudes/WarpFactory @ main)
        run: |
          git clone --depth 1 https://github.com/NerdsWithAttitudes/WarpFactory.git external/WarpFactory
          git -C external/WarpFactory log -1 --format='WarpFactory %h %cs'

      # The shell builder also calls smooth(), a Curve Fitting Toolbox function
      # (Metrics/WarpShell/metricGet_WarpShellComoving.m), undocumented in WarpFactory's README.
      - name: Set up MATLAB with the toolboxes WarpFactory needs
        uses: matlab-actions/setup-matlab@v2
        with:
          products: Parallel_Computing_Toolbox Curve_Fitting_Toolbox
          cache: true

      - name: Build and export the shell
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(genpath('external/WarpFactory')); addpath('matlab'); build_shell

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-results
          path: results/shell/
          if-no-files-found: warn
